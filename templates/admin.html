<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard | LeafCure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/leafcheck-theme.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Poppins;
            background: linear-gradient(135deg,#667eea,#764ba2);
            margin: 0;
            padding: 30px;
        }
        h1,h2 { color: white; }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 230px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,.2);
        }
        .card h2 { color: #667eea; }

        .charts {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }
        canvas {
            background: white;
            padding: 15px;
            border-radius: 15px;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 15px;
            border-collapse: collapse;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #667eea;
            color: white;
        }
        img {
            width: 60px;
            border-radius: 8px;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>🛡️ Admin Dashboard</h1>
<div class="theme-switch">
    <label>
        🌞 / 🌙
        <input type="checkbox" id="themeToggle" onchange="switchTheme()">
    </label>
</div>


<div class="cards">
    <div class="card">
        <h2 id="users">0</h2>
        <p>Total Users</p>
    </div>
    <div class="card">
        <h2 id="detections">0</h2>
        <p>Total Scans</p>
    </div>
</div>

<div class="charts">
    <canvas id="diseaseChart" width="400"></canvas>
    <canvas id="dailyChart" width="400"></canvas>
</div>

<h2>Latest Detections</h2>

<table>
    <thead>
        <tr>
            <th>User</th>
            <th>Disease</th>
            <th>Confidence</th>
            <th>Image</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<button onclick="logout()">Logout</button>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({
    apiKey: "AIzaSyAZNQxPhPOMeGgblrlEDt0xbKysz8oOtmk",
    authDomain: "leafcure-9eeab.firebaseapp.com",
    projectId: "leafcure-9eeab",
    appId: "1:839597084680:web:2d7e5cba7913d0dba481bd"
});

firebase.auth().onAuthStateChanged(async user => {
    if (!user) return location.href = '/login';

    const token = await user.getIdToken(true);
    const res = await fetch('/api/admin/dashboard', {
        headers: { Authorization: token }
    });

    if (!res.ok) {
        alert("Admin access only");
        return location.href = '/dashboard';
    }

    const data = await res.json();

    document.getElementById('users').textContent = data.total_users;
    document.getElementById('detections').textContent = data.total_detections;

    // Disease Chart
    new Chart(document.getElementById('diseaseChart'), {
        type: 'bar',
        data: {
            labels: data.disease_stats.map(d => d._id),
            datasets: [{
                label: 'Disease Count',
                data: data.disease_stats.map(d => d.count),
                backgroundColor: '#667eea'
            }]
        }
    });

    // Daily Chart
    new Chart(document.getElementById('dailyChart'), {
        type: 'line',
        data: {
            labels: data.daily_stats.map(d => d._id),
            datasets: [{
                label: 'Daily Scans',
                data: data.daily_stats.map(d => d.count),
                borderColor: '#764ba2',
                fill: false
            }]
        }
    });

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    data.latest_detections.forEach(d => {
        tbody.innerHTML += `
            <tr>
                <td>${d.uid.slice(0,8)}...</td>
                <td>${d.disease}</td>
                <td>${d.confidence.toFixed(1)}%</td>
                <td><img src="/uploads/${d.image}"></td>
                <td>${new Date(d.timestamp).toLocaleString()}</td>
            </tr>
        `;
    });
});

function logout() {
    firebase.auth().signOut().then(() => location.href='/login');
}
</script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
