<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeafCure - Register</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/leafcheck-theme.css') }}">


    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* 🌿 Nature Background */
            background: url("https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=627&auto=format&fit=crop")
                        no-repeat center center/cover;
        }

        .container {
            width: 380px;
            padding: 30px;
            border-radius: 15px;

            /* ✨ Glassmorphism */
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0px); }
        }

        h2 {
            text-align: center;
            color: white;
            font-weight: 600;
            margin-bottom: 20px;
        }

        input {
            width: 92%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        button {
            width: 96%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            background: #2e7d32;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #1b5e20;
        }

        a {
            color: #ffdddd;
            text-decoration: none;
            font-size: 14px;
        }

        #msg {
            text-align: center;
            color: #ffdddd;
            margin-top: 10px;
        }
    </style>

</head>
<body>
    <div class="theme-switch">
    <label>
        🌞 / 🌙
        <input type="checkbox" id="themeToggle" onchange="switchTheme()">
    </label>
</div>


    <div class="container">
        <h2>Create Your LeafCure Account</h2>

        <input id="name" type="text" placeholder="Full Name" />
        <input id="age" type="number" placeholder="Age" />
        <input id="contact" type="text" placeholder="Contact Number" />
        <input id="address" type="text" placeholder="Address" />
        <input id="email" type="text" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />

        <button onclick="registerUser()">Register</button>

        <p style="text-align:center;margin-top:8px;">
            <a href="/login">Already have an account? Login</a>
        </p>

        <p id="msg"></p>
    </div>

    <script src="/static/js/auth_register.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
