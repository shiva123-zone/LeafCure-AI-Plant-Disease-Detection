<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeafCure - Login</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <!-- Google Font -->
     <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/leafcheck-theme.css') }}">


   <style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1470&auto=format&fit=crop")
    no-repeat center center/cover;
}

.container {
    width: 400px;
    padding: 40px;
    border-radius: 20px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    text-align: center;
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

.logo {
    width: 90px;
    border-radius: 50%;
    margin-bottom: 10px;
}

h2 {
    color: white;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;

    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 15px;
}

input::placeholder {
    color: #ddd;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg,#2e7d32,#66bb6a);
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

.google-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 12px;
    background: white;
    cursor: pointer;
}

.google-btn img {
    width: 22px;
    vertical-align: middle;
}

p a {
    color: #eee;
    font-size: 14px;
    text-decoration: none;
}

#msg {
    color: #ffdddd;
}

</style>

</head>

<body>
    <div class="theme-switch">
    <label>
        🌞 / 🌙
        <input type="checkbox" id="themeToggle" onchange="switchTheme()">
    </label>
</div>


    <div class="container">

        <!-- 🌿 NEW LOGO INSERTED -->
        <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOC396j-YyQpSnG0msHbIFH4q-a6H9yrvaAg&s" />

        <h2>LeafCure Login</h2>

        <input id="email" type="text" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />

        <button class="login-btn" onclick="emailLogin()">Login</button>

        <button class="google-btn" onclick="googleLogin()">
            <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" />
            Login with Google
        </button>

        <p style="margin-top: 10px;">
            <a href="/register" style="color: white; font-size: 14px;">New user? Register here</a>
        </p>

        <p>
            <a href="/forgot-password" style="color: #ffdddd; font-size: 14px;">Forgot password?</a>
        </p>

        <p id="msg"></p>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>


</body>
</html>
